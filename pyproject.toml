[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-theorist"
version = "0.1.0"
description = "Inspectable research contracts, persistence, and ordered learning"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
learning = ["pypdf==6.10.0"]

[project.scripts]
trade-theorist = "trade_theorist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_theorist = ["migrations/*.sql", "dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "dashboard/*.svg"]
